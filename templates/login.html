{% extends "base.html" %}
{% block title %}Log In — NotesHub{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-head">
    <h1>Welcome back</h1>
    <p>Sign in to access your library</p>
  </div>
  <div class="card">
    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="your username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In →</button>
    </form>
  </div>
  <div class="auth-foot" style="margin-top:1rem;">
    No account yet? <a href="{{ url_for('register') }}">Register here</a>
  </div>
</div>
{% endblock %}
