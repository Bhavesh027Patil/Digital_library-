{% extends "base.html" %}
{% block title %}Admin Login — NotesHub{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-head">
    <h1>⚡ Admin Portal</h1>
    <p>Restricted access. Authorised personnel only.</p>
  </div>
  <div class="card" style="border-color:rgba(192,57,43,0.3);">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <span class="admin-chip">🔐 Secure Area</span>
    </div>
    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label for="password">Admin Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter admin password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="background:var(--danger-fg);color:#fff;">
        Access Dashboard →
      </button>
    </form>
  </div>
  <div class="auth-foot" style="margin-top:1rem;">
    <a href="{{ url_for('home') }}">← Back to home</a>
  </div>
</div>
{% endblock %}
